version: '3.8'
networks:
  nids_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
services:
  target_server:
    image: nginx:alpine
    container_name: nids_target
    networks:
      nids_bridge:
        ipv4_address: 10.5.0.10
    ports:
      - "80:80"
    restart: always